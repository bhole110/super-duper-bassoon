  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
    }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background:
        radial-gradient(circle at 50% 20%, rgba(99, 102, 241, 0.18), transparent 35%),
        radial-gradient(circle at 20% 80%, rgba(168, 85, 247, 0.12), transparent 30%),
        #070914;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 24px 16px;
      text-align: center;
      overflow-x: hidden;
    }

    .wrapper {
      width: 100%;
      max-width: 400px;
    }

    .logo {
      font-size: clamp(1.7rem, 7vw, 2.15rem);
      margin-bottom: 12px;
      font-weight: 800;
      letter-spacing: 0.7px;
      line-height: 1.2;

      background: linear-gradient(
        90deg,
        #f8fafc,
        #a78bfa,
        #60a5fa
      );
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle {
      font-size: 0.95rem;
      color: #8f98aa;
      margin-bottom: 28px;
      font-weight: 500;
    }

    .btn {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 58px;
      padding: 15px 24px;

      background: linear-gradient(
        135deg,
        #8b5cf6 0%,
        #6366f1 50%,
        #3b82f6 100%
      );

      color: #fff;
      font-weight: 800;
      font-size: 1.05rem;
      letter-spacing: 0.3px;
      text-decoration: none;

      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 16px;

      box-shadow:
        0 10px 28px rgba(79, 70, 229, 0.28),
        inset 0 1px 0 rgba(255, 255, 255, 0.22);

      overflow: hidden;
      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease;
    }

    .btn::before {
      content: "";
      position: absolute;
      top: 0;
      left: -120%;
      width: 70%;
      height: 100%;

      background: linear-gradient(
        100deg,
        transparent,
        rgba(255, 255, 255, 0.28),
        transparent
      );

      transform: skewX(-20deg);
      animation: shine 2.8s infinite;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow:
        0 14px 34px rgba(79, 70, 229, 0.38),
        inset 0 1px 0 rgba(255, 255, 255, 0.25);
    }

    .btn:active {
      transform: scale(0.98);
    }

    @keyframes shine {
      0% {
        left: -120%;
      }

      45%,
      100% {
        left: 150%;
      }
    }

    .footer {
      font-size: 0.72rem;
      color: #596174;
      margin-top: 24px;
      line-height: 1.5;
      font-weight: 500;
    }

    @media (max-width: 380px) {
      body {
        padding: 20px 14px;
      }

      .logo {
        font-size: 1.65rem;
      }

      .btn {
        min-height: 55px;
        font-size: 1rem;
      }
    }
  </style>
